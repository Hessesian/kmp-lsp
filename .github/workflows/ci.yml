name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'skills/**'
      - 'contrib/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    # The e2e smoke test (smoke_completion_from_compiled_jar) drives the real
    # server against a compiled fixture JAR, which requires the sidecar —
    # without it the JAR pipeline silently produces nothing and the test
    # times out on every platform.
    needs: build-sidecar-jar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Place the sidecar next to the test binary (target/debug/) — the
      # server resolves `kmp-jar-indexer.jar` adjacent to its own executable.
      - name: Fetch sidecar JAR
        uses: actions/download-artifact@v4
        with:
          name: sidecar-jar
          path: target/debug

      - name: Install runtime tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install runtime tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fd

      - name: Install runtime tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y --no-progress ripgrep fd
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features --no-fail-fast

  build-sidecar-jar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build sidecar JAR
        run: ./gradlew shadowJar
      - name: Upload sidecar JAR
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-jar
          path: java-sidecar/build/libs/kmp-jar-indexer.jar
          if-no-files-found: error
