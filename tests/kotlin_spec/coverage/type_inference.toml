[[requirements]]
id = "KS-TYPE-INFERENCE-0011"
statement = "Smart-cast types usually participate in inference, but a direct property declaration retains the source declaration type while a generic call may infer from the smart-cast type."
classification = "exact"
capabilities = ["inlay hints"]
status = "ignored"
tests = ["ks_type_inference_0011_direct_property_declaration_uses_the_declared_type"]
duplicates = []
fixture = "After a null guard, direct assignment must infer Any? while identity(value) must infer Any."
ignore_reason = "kmp-lsp does not preserve the direct-property smart-cast inference exception."
observed_failure = "The individually executed fixture produced no : Any? inlay label for the direct declaration."
expected_behavior = "The direct property must retain Any?, while the generic call result must infer Any from the smart-cast argument."

[[requirements]]
id = "KS-TYPE-INFERENCE-0013"
statement = "A sink is stable only when external means cannot change its value; mutable capture is one condition that breaks smart-cast stability."
classification = "exact"
capabilities = ["diagnostics"]
status = "ignored"
tests = ["ks_type_inference_0013_captured_mutable_property_is_not_a_stable_smart_cast_sink"]
duplicates = []
fixture = "An immutable parameter smart cast is valid, while a mutable local captured by a mutating lambda is invalid at member access."
ignore_reason = "kmp-lsp does not diagnose unstable captured smart-cast sinks."
observed_failure = "The individually executed captured-mutable fixture had a clean CST instead of the required semantic rejection."
expected_behavior = "Member access relying on the captured mutable smart cast must be rejected as unstable."

[[requirements]]
id = "KS-TYPE-INFERENCE-0016"
statement = "A direct sink remains valid before any nested redefinition, while a nested sink requires no nested redefinition and every direct redefinition to precede it."
classification = "exact"
capabilities = ["diagnostics"]
status = "ignored"
tests = ["ks_type_inference_0016_effectively_immutable_rules_cover_direct_and_nested_sinks"]
duplicates = []
fixture = "Paired direct and nested sink fixtures cover the valid order and a competing invalid redefinition order."
ignore_reason = "kmp-lsp does not diagnose invalid smart casts at direct and nested sinks."
observed_failure = "The first individually executed invalid redefinition fixture had a clean CST instead of semantic rejection."
expected_behavior = "Nested redefinition before a direct sink and direct redefinition after a nested sink must invalidate the smart cast."

[[requirements]]
id = "KS-TYPE-INFERENCE-0017"
statement = "Loop-body facts generally do not escape, but while(true) and do-while bodies are definitely evaluated at least once and may propagate smart casts to following code."
classification = "exact"
capabilities = ["diagnostics"]
status = "ignored"
tests = ["ks_type_inference_0017_definitely_evaluated_loops_propagate_smart_cast_facts"]
duplicates = []
fixture = "Exact while(true) and do-while loops establish non-null String access, while a competing non-exact condition does not."
ignore_reason = "kmp-lsp does not implement semantic smart-cast diagnostics across loop exits."
observed_failure = "The individually executed non-exact-loop fixture had a clean CST instead of the required semantic rejection."
expected_behavior = "Facts from definitely evaluated loop forms must propagate, while the non-exact while condition must not receive the current implementation's special treatment."

