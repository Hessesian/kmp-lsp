[[requirements]]
id = "KS-TYPE-INFERENCE-0003"
statement = "A smart cast flow-sensitively refines an expression's compile-time type when its runtime type is guaranteed, avoiding an explicit cast."
classification = "exact"
capabilities = ["inlay hints"]
status = "ignored"
tests = ["ks_type_inference_0003_stable_type_check_enables_member_result_inference"]
duplicates = []
fixture = "Inside an is String branch, a member result from the refined receiver must infer as Int."
ignore_reason = "kmp-lsp does not infer member result types through smart casts."
observed_failure = "The individually executed fixture produced no : Int inlay label."
expected_behavior = "The stable String smart cast must permit length access and infer Int for the local result."
