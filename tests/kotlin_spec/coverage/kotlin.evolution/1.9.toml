id = "KL-1-9-0002"
introduced_in = "1.9"
maturity = "stable"
stabilized_in = "1.9"
change_kind = "changed"
statement = "An unambiguous callable reference retains its declaration target when its surrounding expected type is incompatible, allowing the mismatch to be reported on the containing expression."
capabilities = ["definition", "syntax diagnostics"]
classification = "exact"
status = "active"
audit_item_ids = ["KCA-1-9-0249"]
tests = ["kl_1_9_0002_callable_reference_keeps_target_when_expected_type_conflicts"]
fixture = "ReferencedSpec and ExpectedSpec compete through an incompatible property type while ::ReferencedSpec remains unambiguous."
sample_evidence = "Typed callback and factory properties should preserve navigation even while the editor reports an outer type mismatch."
oracle = "Pinned Kotlin 2.4.10 compiler data resolves the referenced constructor and reports INITIALIZER_TYPE_MISMATCH instead of an unresolved reference."

