id = "KL-1-9-0001"
introduced_in = "1.9"
maturity = "stable"
stabilized_in = "1.9"
change_kind = "changed"
statement = "A class literal must have an explicit type or value to the left of ::class; the empty ::class form is rejected."
capabilities = ["syntax diagnostics"]
classification = "exact"
status = "ignored"
audit_item_ids = ["KCA-1-9-0241"]
tests = ["kl_1_9_0001_class_literal_requires_a_left_hand_side"]
fixture = "String::class is valid while a competing top-level ::class expression is invalid."
sample_evidence = "Reflection-oriented Kotlin source must not silently accept a class literal with no receiver."
oracle = "Pinned Kotlin 2.4.10 compiler diagnostics mark every empty-left-hand-side ::class form as unsupported."
ignore_reason = "Observed red: tree-sitter-kotlin accepts ::class as a clean callable-reference CST and kmp-lsp emits no diagnostic."
observed_failure = "The invalid ::class control produced a clean callable_reference node."
expected_behavior = "The empty-left-hand-side class literal must receive a diagnostic while String::class remains valid."

