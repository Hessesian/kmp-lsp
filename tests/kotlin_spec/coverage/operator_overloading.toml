[[requirements]]
id = "KS-OPERATORS-0007"
statement = "Every call expression produced by a convention expansion may select only a function declared with the operator modifier."
classification = "exact"
capabilities = ["syntax diagnostics", "definition"]
status = "ignored"
tests = ["ks_operators_0007_operator_convention_requires_the_operator_modifier"]
duplicates = []
fixture = "A valid operator plus and an otherwise identical ordinary plus are each used through the binary plus syntax."
ignore_reason = "Observed red: binary plus backed only by a non-operator plus function has a clean CST and kmp-lsp emits no operator-suitability diagnostic."
observed_failure = "The non-operator plus control produced a clean CST instead of the expected modifier diagnostic."
expected_behavior = "Binary plus backed only by an ordinary plus function must receive an operator-suitability diagnostic."

