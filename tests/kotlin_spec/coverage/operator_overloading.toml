[[requirements]]
id = "KS-OPERATORS-0022"
statement = "Every destructuring placeholder is either an identifier or the special ignore marker _, which is not a Kotlin identifier."
classification = "exact"
capabilities = ["syntax diagnostics", "document symbols"]
status = "ignored"
tests = ["ks_operators_0022_standalone_underscore_is_not_an_identifier", "ks_operators_0022_ignore_marker_introduces_no_property"]
duplicates = ["ks_declarations_0306_destructuring_ignore_marker_introduces_no_name"]
fixture = "A three-entry declaration retains two identifiers around an ignore marker, while a standalone property named underscore is rejected."
ignore_reason = "Observed red independently at both boundaries: tree-sitter-kotlin accepts val _ as a clean property declaration, and kmp-lsp indexes a destructuring ignore marker as a local symbol named _."
observed_failure = "The standalone underscore produced a clean CST, while the destructuring ignore marker appeared in file symbols as though it were an introduced identifier."
expected_behavior = "A standalone property named underscore must be diagnosed, and a destructuring ignore marker must introduce no indexed symbol."

