[[requirements]]
id = "KL-2-4-0001"
maturity = "experimental"
required_compiler_flag = "-Xcollection-literals"
statement = "A collection literal is valid only when its expected type supplies a companion operator factory named of that accepts the literal elements."
capabilities = ["syntax diagnostics", "definition"]
classification = "exact"
status = "ignored"
tests = ["kl_2_4_0001_collection_literal_requires_an_operator_factory"]
fixture = "CollectionSpec supplies a companion operator factory for a String literal while MissingFactorySpec is an otherwise matching expected type without a factory."
sample_evidence = "Collection literals can construct domain collection types concisely while retaining the expected type's construction contract."
oracle = "Pinned Kotlin 2.4.10 enables CollectionLiterals through -Xcollection-literals and accepts literals only when the expected type resolves a suitable companion operator factory."
ignore_reason = "Observed red: kmp-lsp parses a collection literal without checking whether the expected type supplies an operator factory."
observed_failure = "The individually executed MissingFactorySpec control produced a clean collection-literal CST."
expected_behavior = "The CollectionSpec literal must remain clean while the MissingFactorySpec literal receives a diagnostic for its absent factory."

