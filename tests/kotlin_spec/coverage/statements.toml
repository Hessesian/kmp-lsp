[[requirements]]
id = "KS-STATEMENTS-0005"
statement = "An identifier or navigation assignment target must refer to a mutable property."
classification = "exact"
capabilities = ["syntax diagnostics", "definition", "hover"]
status = "ignored"
tests = ["ks_statements_0005_read_only_local_property_cannot_be_assignment_left_hand_side", "ks_statements_0005_read_only_navigation_property_cannot_be_assignment_left_hand_side"]
duplicates = ["ks_declarations_0296_read_only_property_cannot_be_reassigned_after_initializer"]
fixture = "Separate local and member fixtures contrast valid var assignments with same-shaped invalid val assignments."
ignore_reason = "Observed red independently for both variants: tree-sitter-kotlin accepts assignment to the val with a clean CST and kmp-lsp has no semantic reassignment diagnostic."
observed_failure = "Each invalid val assignment produced a clean CST instead of the expected reassignment diagnostic."
expected_behavior = "Both the read-only local target and read-only member-navigation target must receive reassignment diagnostics while their var controls remain valid."

