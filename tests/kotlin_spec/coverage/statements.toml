[[requirements]]
id = "KS-STATEMENTS-0024"
statement = "Break and continue expressions are allowed only inside a loop body."
classification = "exact"
capabilities = ["syntax diagnostics", "definition"]
status = "ignored"
tests = ["ks_statements_0024_break_is_allowed_only_in_loop_bodies", "ks_statements_0024_continue_is_allowed_only_in_loop_bodies"]
duplicates = []
fixture = "Independent break and continue fixtures contrast valid loop-body jumps with same-shaped jumps in standalone function bodies."
ignore_reason = "Observed red independently for break and continue: each valid loop-body control parsed, but the corresponding standalone jump also had a clean CST and no semantic diagnostic."
observed_failure = "Both standalone jump fixtures produced clean CSTs instead of outside-loop diagnostics."
expected_behavior = "The standalone break and standalone continue must each receive a diagnostic while their loop-body controls remain valid."

