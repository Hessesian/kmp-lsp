oracle = "kotlin-spec.pdf 1.2.2 and 1.2.4 printed pages 12-18; tree-sitter-kotlin CST."
fallback_oracle = "Not used; the hard-keyword restriction is explicit."
ignore_reason = "Observed red: tree-sitter-kotlin 0.3 accepts val if = 1 and emits if as a simple_identifier."
expected_behavior = "The unescaped hard keyword must produce a syntax error while the backtick-escaped form parses."

