[workspace]
members = ["."]

[package]
name        = "kmp-lsp"
version = "0.25.0"
edition     = "2021"
description = "Fast, low-memory LSP server for Kotlin, Java, and Swift. Instant startup, dot-completion, go-to-definition, hover — no JVM required."
license     = "MIT"
repository  = "https://github.com/Hessesian/kmp-lsp"
homepage    = "https://github.com/Hessesian/kmp-lsp"
readme      = "README.md"
keywords    = ["lsp", "kotlin", "java", "swift", "language-server"]
categories  = ["development-tools", "command-line-utilities"]
exclude      = ["demo/*", "contrib/*", ".tours/*", "docs/*", ".github/*"]

[[bin]]
name = "kmp-lsp"
path = "src/main.rs"

[dependencies]
# LSP protocol
tower-lsp  = "0.20"
tokio      = { version = "1", features = ["full"] }

# Parsing
tree-sitter      = "0.26"
tree-sitter-java = "0.23"
# The canonical tree-sitter-kotlin crate has been stuck at 0.3.8 (ABI 14) on
# crates.io since 2024-08, ~2 years behind its own upstream `fwcd/tree-sitter-kotlin`
# main branch, with an open unanswered "please cut a release" issue. This is
# BrokkAI's fork, tracking upstream main, published to route around the stall —
# aliased under the same crate name so every `tree_sitter_kotlin::` path in this
# codebase keeps working unchanged.
tree-sitter-kotlin = { package = "brokk-tree-sitter-kotlin", version = "0.4.0" }
# The published crate hard-pins tree-sitter = "0.22", which conflicts with
# the core bump above (Cargo's `links` uniqueness rule) — this is our own
# sibling repo (https://github.com/Hessesian/tree-sitter-swift), bumped to
# 0.26 there and referenced by rev rather than vendoring its source here.
tree-sitter-swift-bundled = { git = "https://github.com/Hessesian/tree-sitter-swift", rev = "00ddccfa09fc556f7e1120d3d3a2fd62ec86bd65" }

# Concurrent index storage (no Mutex needed)
dashmap = "5"

# Logging
log        = "0.4"
env_logger = "0.11"

# File discovery fallback
walkdir = "2"
ignore = "0.4"
globset = "0.4"

# Index cache serialization
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode  = "1"
sha2 = "0.10"
zip = "2"
zstd = "0.13"
futures = "0.3.32"
lexopt = "0.3"
parking_lot = "0.12.5"
# jemalloc: dramatically reduces RSS on long-running processes by avoiding
# glibc malloc arena fragmentation (same pattern as rust-analyzer)
# Not supported on Windows.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
strip     = true

# Profiling: release speed + debug symbols for flamegraphs
# Usage: cargo build --profile profiling && samply record ./target/profiling/kmp-lsp index .
[profile.profiling]
inherits  = "release"
debug     = 2
strip     = false
lto       = false

[dev-dependencies]
tempfile = "3"

# cargo-binstall metadata — lets `cargo binstall kmp-lsp` download the
# pre-built binary from GitHub Releases instead of compiling from source.
# Combined tarballs contain both `kmp-lsp` and `kmp-jar-indexer`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/kmp-lsp-linux-{ target-arch }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "macos")']
pkg-url = "{ repo }/releases/download/v{ version }/kmp-lsp-darwin-{ target-arch }{ archive-suffix }"
